# CI: fresh checkout → full install → all gates.
# (Runs on GitHub; the same commands pass locally via `make ci-local`.)
name: ci

# Fix 2: GHCR push requires packages: write (safe even if not pushing)
permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/xpay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full requirements
        working-directory: backend
        run: pip install -r requirements-full.txt

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed users from JSON
        working-directory: backend
        run: python scripts/migrate_json_to_db.py

      - name: Smoke gate (imports + end-to-end pipeline)
        run: python backend/tests/test_smoke.py

      - name: Unit tests
        run: python backend/tests/test_core.py
        env:
          USE_TRAINED_GNN: "false"

      - name: Step suites
        run: |
          python backend/tests/test_step3.py
          python backend/tests/test_step4.py

      - name: Financial correctness suite
        run: python backend/tests/test_financial.py
        env:
          USE_TRAINED_GNN: "false"

      - name: ROI model suite
        run: python backend/tests/test_roi.py

      - name: Sanctions benchmark
        run: python backend/evals/eval_sanctions.py

      - name: RAG retrieval benchmark
        run: python backend/evals/eval_rag.py

      - name: End-to-end scenario evaluation (A-H)
        run: python backend/evals/eval_scenarios.py
        env:
          USE_TRAINED_GNN: "false"

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build full-system backend image
        run: docker build -t xpay-backend -f backend/Dockerfile backend

      - name: Run image smoke test (with DB)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/xpay
        run: |
          # Start backend with DB URL pointing to service postgres via host network
          docker run -d --name xpay --network host -e DATABASE_URL=$DATABASE_URL -e PYTHONUNBUFFERED=1 xpay-backend sh -c "alembic upgrade head && python scripts/migrate_json_to_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/api/health
          # Authenticated smoke test — /api/routes/compare now requires JWT (RBAC)
          TOKEN=$(curl -sf -X POST http://localhost:8000/token -H "Content-Type: application/x-www-form-urlencoded" -d "username=user@xpay.com&password=UserPass123!" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then echo "Failed to obtain JWT token"; docker logs xpay; exit 1; fi
          curl -sf -H "Authorization: Bearer $TOKEN" "http://localhost:8000/api/routes/compare?amount=1000" | grep -o "Stellar Hybrid Anchor"
