# Render Blueprint for borderless-money.
# The canonical copy is also available at the repository root as render.yaml.
services:
  - type: web
    name: borderless-money-api
    env: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: XPAY_CORS_ORIGINS
        value: https://borderless-money-web.onrender.com,http://localhost:3000
      - key: XPAY_RATE_LIMIT
        value: 240/minute
      - key: USE_TRAINED_GNN
        value: "false"

  - type: web
    name: borderless-money-web
    env: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://borderless-money-api.onrender.com

  - type: web
    name: borderless-money-mcp
    env: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    dockerCommand: python -m app.mcp.server
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: PYTHONUNBUFFERED
        value: "1"
